name: histae-rust-dev

x-infrastructure-logging: &infrastructure-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

x-development-environment: &development-environment
  ENV: development
  PORT: "8080"
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_SSLMODE: disable
  POSTGRES_USER: histae_app
  POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD:?Define POSTGRES_APP_PASSWORD in .env}
  POSTGRES_ADMIN_PASSWORD: ""
  POSTGRES_MIGRATE_PASSWORD: ""
  POSTGRES_APP_PASSWORD: ""
  HISTAE_BOOTSTRAP_MIGRATE_PASSWORD: ""
  HISTAE_BOOTSTRAP_APP_PASSWORD: ""
  REDIS_ADDR: redis:6379
  # Le Redis de cette pile démarre sans authentification.
  REDIS_PASSWORD: ""
  REDIS_TLS: "false"
  OBJECT_STORAGE_ENDPOINT: http://storage.histae.localhost:8333
  PHOTO_MODERATION_ENDPOINT: http://photo-moderation:8080
  METRICS_HOST: 0.0.0.0

services:
  migrate:
    environment:
      <<: *development-environment
      POSTGRES_USER: histae_migrate
      POSTGRES_PASSWORD: ${POSTGRES_MIGRATE_PASSWORD:?Define POSTGRES_MIGRATE_PASSWORD in .env}
      MAINTENANCE_MODE: disabled
      METRICS_ENABLED: "false"
    depends_on:
      postgres: { condition: service_healthy }

  api:
    environment:
      <<: *development-environment
      MAINTENANCE_MODE: disabled
    dns:
      - ${HISTAE_API_DNS_SERVER:-1.1.1.1}
    ports:
      - ${HISTAE_API_BIND_IP:-127.0.0.1}:${HISTAE_API_HOST_PORT:-8080}:8080
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      object-storage: { condition: service_healthy }
      photo-moderation: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  outbox-worker:
    environment:
      <<: *development-environment
      MAINTENANCE_MODE: worker
      METRICS_ENABLED: "false"
    depends_on:
      redis: { condition: service_healthy }
      object-storage: { condition: service_healthy }
      photo-moderation: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  maintenance:
    environment:
      <<: *development-environment
      MAINTENANCE_MODE: worker
      METRICS_ENABLED: "false"
    depends_on:
      redis: { condition: service_healthy }
      object-storage: { condition: service_healthy }
      photo-moderation: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  postgres:
    image: ${HISTAE_POSTGRES_IMAGE:-histae-postgres:18.6-postgis3.6.4}
    build: ./docker/postgres
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - compute_query_id=auto
      - -c
      - pg_stat_statements.track_utility=off
    logging: *infrastructure-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-histae-dev}
      POSTGRES_USER: histae_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Define POSTGRES_ADMIN_PASSWORD in .env}
      HISTAE_BOOTSTRAP_MIGRATE_PASSWORD: ${POSTGRES_MIGRATE_PASSWORD:?Define POSTGRES_MIGRATE_PASSWORD in .env}
      HISTAE_BOOTSTRAP_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Define POSTGRES_APP_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --data-checksums --auth-host=scram-sha-256
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5433}:5432
    volumes:
      - histae-rust-postgres-data:/var/lib/postgresql
      - ./docker/postgres/init-roles.sh:/docker-entrypoint-initdb.d/001_roles.sh:ro
      - ./docker/postgres:/etc/postgresql/histae:ro
      - ./db:/etc/histae/db:ro
    healthcheck:
      # Le serveur temporaire d'initdb n'écoute que sur le socket Unix.
      # Attendre le serveur TCP utilisé par migrate et l'API.
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -p 5432 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 1m
    shm_size: 256m
    pids_limit: 256
    mem_limit: 1g
    cpus: 2.0
    networks:
      - backend

  # Compteurs de rate limiting et relais Pub/Sub SSE ; aucune donnée métier durable.
  redis:
    image: redis:7.4.2-alpine
    logging: *infrastructure-logging
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
    ports:
      - 127.0.0.1:6379:6379
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    pids_limit: 128
    mem_limit: 192m
    cpus: 0.5
    networks:
      - backend

  object-storage:
    image: chrislusf/seaweedfs:4.45
    logging: *infrastructure-logging
    command: [mini, -dir=/data]
    environment:
      AWS_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY:-histae-dev}
      AWS_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_KEY:-histae-dev-secret-change-me}
      S3_BUCKET: ${OBJECT_STORAGE_BUCKET:-histae-photos}
    ports:
      - 127.0.0.1:8333:8333
    volumes:
      - histae-rust-object-storage-data:/data
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8333/healthz]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 30s
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    networks:
      backend:
        aliases:
          - storage.histae.localhost

  photo-moderation:
    build:
      context: ./services/photo-moderation
    logging: *infrastructure-logging
    environment:
      MODERATION_TOKEN: ${PHOTO_MODERATION_TOKEN:?Define PHOTO_MODERATION_TOKEN in .env}
    ports:
      - 127.0.0.1:8090:8080
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 90s
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    pids_limit: 128
    mem_limit: 2g
    cpus: 2.0
    networks:
      - backend

volumes:
  histae-rust-postgres-data:
  histae-rust-object-storage-data:

networks:
  backend:
