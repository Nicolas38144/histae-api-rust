# À combiner uniquement avec compose.yaml. Image compilée, sans montage des sources.
# Pile initiale sur un serveur de 16 Gio : PostgreSQL à 7 Gio, Redis et S3.
# Certificat serveur et CA à préparer selon docs/deployment/container-deployment.md.
name: histae-api-production

# .env supplies Compose interpolation only. Each process gets the keys below.
x-production-database-environment: &production-database-environment
  ENV: production
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB in .env}
  POSTGRES_SSLMODE: verify-full
  NODE_EXTRA_CA_CERTS: /run/secrets/postgres_ca
  POSTGRES_CONNECT_TIMEOUT: ${POSTGRES_CONNECT_TIMEOUT:-}
  POSTGRES_IDLE_TIMEOUT: ${POSTGRES_IDLE_TIMEOUT:-}
  POSTGRES_STATEMENT_TIMEOUT: ${POSTGRES_STATEMENT_TIMEOUT:-}
  POSTGRES_IDLE_TRANSACTION_TIMEOUT: ${POSTGRES_IDLE_TRANSACTION_TIMEOUT:-}

x-production-storage-environment: &production-storage-environment
  OBJECT_STORAGE_ENDPOINT: https://${HISTAE_STORAGE_HOST:?Define the public S3 hostname in HISTAE_STORAGE_HOST}
  OBJECT_STORAGE_FORCE_PATH_STYLE: "true"
  OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-}
  OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-}
  OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-}
  OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-}

x-production-redis-environment: &production-redis-environment
  REDIS_ADDR: redis:6379
  REDIS_TLS: "true"
  REDIS_PASSWORD: ${REDIS_PASSWORD:?Define REDIS_PASSWORD in .env}
  REDIS_DB: ${REDIS_DB:-}
  REDIS_CONNECT_TIMEOUT: ${REDIS_CONNECT_TIMEOUT:-}
  REDIS_COMMAND_TIMEOUT: ${REDIS_COMMAND_TIMEOUT:-}

x-production-phone-environment: &production-phone-environment
  PHONE_HASH_KEY: ${PHONE_HASH_KEY:?Define PHONE_HASH_KEY in .env}
  PHONE_ENCRYPTION_KEY: ${PHONE_ENCRYPTION_KEY:?Define PHONE_ENCRYPTION_KEY in .env}
  SMS_PROVIDER: ${SMS_PROVIDER:-}
  SWEEGO_SMS_REGION: ${SWEEGO_SMS_REGION:-}
  SWEEGO_TIMEOUT: ${SWEEGO_TIMEOUT:-}
  OTP_TTL: ${OTP_TTL:-}
  OTP_RESEND_COOLDOWN: ${OTP_RESEND_COOLDOWN:-}
  SMS_MAX_GLOBAL_HOUR: ${SMS_MAX_GLOBAL_HOUR:-}
  SMS_MAX_GLOBAL_DAY: ${SMS_MAX_GLOBAL_DAY:-}
  SMS_MAX_PER_PHONE_HOUR: ${SMS_MAX_PER_PHONE_HOUR:-}
  SMS_MAX_PER_PHONE_DAY: ${SMS_MAX_PER_PHONE_DAY:-}
  SMS_ALERT_SPIKE_5M: ${SMS_ALERT_SPIKE_5M:-}
  SMS_SENDING_SUSPENDED: ${SMS_SENDING_SUSPENDED:-}

x-production-store-flags: &production-store-flags
  APP_STORE_ENABLED: ${APP_STORE_ENABLED:-}
  GOOGLE_PLAY_ENABLED: ${GOOGLE_PLAY_ENABLED:-}

x-production-stores-environment: &production-stores-environment
  <<: *production-store-flags
  STORE_VERIFIER_URL: https://store-verifier:8080
  STORE_VERIFIER_CA_FILE: /run/secrets/store_verifier_ca
  STORE_VERIFIER_TOKEN: ${STORE_VERIFIER_TOKEN:-}
  APP_STORE_PREMIUM_MONTHLY_PRODUCT_ID: ${APP_STORE_PREMIUM_MONTHLY_PRODUCT_ID:-}
  APP_STORE_PREMIUM_ANNUAL_PRODUCT_ID: ${APP_STORE_PREMIUM_ANNUAL_PRODUCT_ID:-}
  GOOGLE_PLAY_PREMIUM_PRODUCT_ID: ${GOOGLE_PLAY_PREMIUM_PRODUCT_ID:-}
  GOOGLE_PLAY_MONTHLY_BASE_PLAN_ID: ${GOOGLE_PLAY_MONTHLY_BASE_PLAN_ID:-}
  GOOGLE_PLAY_ANNUAL_BASE_PLAN_ID: ${GOOGLE_PLAY_ANNUAL_BASE_PLAN_ID:-}

x-production-legal-environment: &production-legal-environment
  LEGAL_REVIEW_REFERENCE: ${LEGAL_REVIEW_REFERENCE:-}
  TERMS_OF_SERVICE_URL: ${TERMS_OF_SERVICE_URL:-}
  TERMS_OF_SERVICE_VERSION: ${TERMS_OF_SERVICE_VERSION:-}
  TERMS_OF_SERVICE_DOCUMENT_DATE: ${TERMS_OF_SERVICE_DOCUMENT_DATE:-}
  PRIVACY_POLICY_URL: ${PRIVACY_POLICY_URL:-}
  PRIVACY_POLICY_VERSION: ${PRIVACY_POLICY_VERSION:-}
  PRIVACY_POLICY_DOCUMENT_DATE: ${PRIVACY_POLICY_DOCUMENT_DATE:-}
  SENSITIVE_DATA_CONSENT_URL: ${SENSITIVE_DATA_CONSENT_URL:-}
  SENSITIVE_DATA_CONSENT_VERSION: ${SENSITIVE_DATA_CONSENT_VERSION:-}
  SENSITIVE_DATA_CONSENT_DOCUMENT_DATE: ${SENSITIVE_DATA_CONSENT_DOCUMENT_DATE:-}
  LOCATION_CONSENT_URL: ${LOCATION_CONSENT_URL:-}
  LOCATION_CONSENT_VERSION: ${LOCATION_CONSENT_VERSION:-}
  LOCATION_CONSENT_DOCUMENT_DATE: ${LOCATION_CONSENT_DOCUMENT_DATE:-}

x-production-logging: &production-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

x-production-dependencies: &production-dependencies
  migrate:
    condition: service_completed_successfully
  storage-init:
    condition: service_completed_successfully

services:
  store-verifier:
    environment:
      ENV: production
      STORE_VERIFIER_TLS_CERT_FILE: /run/secrets/store_verifier_cert
      STORE_VERIFIER_TLS_KEY_FILE: /run/secrets/store_verifier_key
    secrets: [store_verifier_ca, store_verifier_cert, store_verifier_key]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          require('node:https').get({
            hostname: '127.0.0.1',
            port: 8080,
            path: '/health/live',
            servername: 'store-verifier',
            ca: require('node:fs').readFileSync('/run/secrets/store_verifier_ca'),
            agent: false
          }, response => {
            response.resume();
            if (response.statusCode !== 200) {
              console.error('Unexpected health status:', response.statusCode);
              process.exitCode = 1;
            }
          }).on('error', error => {
            console.error(error.message);
            process.exitCode = 1;
          });

  # Instance unique persistante, accessible uniquement sur le réseau backend.
  postgres:
    image: ${HISTAE_POSTGRES_IMAGE:-histae-postgres:18.7-postgis3.7.0}
    build: ./docker/postgres
    command: [postgres, -c, config_file=/etc/postgresql/histae/postgresql.conf]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB in .env}
      POSTGRES_USER: histae_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Define POSTGRES_ADMIN_PASSWORD in .env}
      HISTAE_BOOTSTRAP_MIGRATE_PASSWORD: ${POSTGRES_MIGRATE_PASSWORD:?Define POSTGRES_MIGRATE_PASSWORD in .env}
      HISTAE_BOOTSTRAP_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Define POSTGRES_APP_PASSWORD in .env}
      HISTAE_BOOTSTRAP_MAINTENANCE_PASSWORD: ${POSTGRES_MAINTENANCE_PASSWORD:?Define POSTGRES_MAINTENANCE_PASSWORD in .env}
      HISTAE_BOOTSTRAP_OUTBOX_PASSWORD: ${POSTGRES_OUTBOX_PASSWORD:?Define POSTGRES_OUTBOX_PASSWORD in .env}
      HISTAE_BOOTSTRAP_PHONE_SYNC_PASSWORD: ${POSTGRES_PHONE_SYNC_PASSWORD:?Define POSTGRES_PHONE_SYNC_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --data-checksums --auth-host=scram-sha-256
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      # Volume distinct du développement, même si le nom de projet est identique.
      - histae-postgres-production-data:/var/lib/postgresql
      - type: bind
        source: ./docker/postgres/init-roles.sh
        target: /docker-entrypoint-initdb.d/001_roles.sh
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./db
        target: /etc/histae/db
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./docker/postgres
        target: /etc/postgresql/histae
        read_only: true
        bind:
          create_host_path: false
      # La clé reste sur l'hôte, hors image ; permissions Unix strictes requises.
      - type: bind
        source: ./.secrets/postgres
        target: /etc/postgresql/tls
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      # Ne pas annoncer healthy pendant le serveur temporaire d'initdb.
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -p 5432 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
      start_interval: 2s
    restart: unless-stopped
    stop_grace_period: 1m
    shm_size: 256m
    pids_limit: 256
    # Limite totale du conteneur ; buffers, requêtes et /dev/shm y sont inclus.
    mem_limit: 7g
    memswap_limit: 7g
    cpus: 2.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    networks:
      - backend

  # Redis éphémère, TLS et authentification obligatoires, aucune écoute TCP en clair.
  redis:
    image: redis:7.4.12-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    entrypoint: [/bin/sh, /etc/redis/histae-entrypoint.sh]
    command: []
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Define REDIS_PASSWORD in .env}
    volumes:
      - ./docker/redis/redis.conf:/etc/redis/histae.conf:ro
      - ./docker/redis/users.acl:/etc/redis/histae-users.acl:ro
      - type: bind
        source: ./docker/redis/entrypoint.sh
        target: /etc/redis/histae-entrypoint.sh
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.secrets/redis
        target: /etc/redis/tls
        read_only: true
        bind:
          create_host_path: false
    secrets: [postgres_ca]
    tmpfs: ["/run/redis:size=1m,mode=0755,noexec,nosuid,nodev"]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli --tls --cacert /run/secrets/postgres_ca -h redis ping | grep -qx PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    logging: *production-logging
    networks: [redis-private]

  # SeaweedFS server (master, volume, filer et S3). Only the S3 HTTP socket is shared.
  object-storage:
    image: chrislusf/seaweedfs:4.55@sha256:7ca46aeae2f223b37e5d91593c17ab37738eec6df6ab69b48a0487f7643342b9
    network_mode: none
    # The socket inherits the gateways' group before the upstream entrypoint drops root.
    entrypoint:
      - /bin/sh
      - -ec
      - |
        chown seaweed:101 /run/seaweedfs
        chmod 2750 /run/seaweedfs
        umask 0007
        exec /entrypoint.sh "$$@"
      - --
    command:
      - server
      - -dir=/data
      - -ip=127.0.0.1
      - -ip.bind=127.0.0.1
      - -master.telemetry=false
      - -master.volumeSizeLimitMB=1024
      - -volume.max=0
      - -volume.index=leveldb
      - -filer
      - -filer.exposeDirectoryData=false
      - -iam=false
      - -sftp=false
      - -s3
      - -s3.config=/run/secrets/s3_identity
      - -s3.iam=false
      - -s3.localSocket=/run/seaweedfs/s3.sock
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -s3.allowDeleteBucketNotEmpty=false
      - -s3.autoCreateBucket=false
      - -s3.concurrentUploadLimitMB=32
    volumes:
      - histae-object-storage-production-data:/data
      - ./docker/seaweedfs/filer.toml:/etc/seaweedfs/filer.toml:ro
      - storage-s3-socket:/run/seaweedfs
    secrets: [s3_identity]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -S /run/seaweedfs/s3.sock
          && wget -q --spider http://127.0.0.1:9333/readyz
          && wget -q --spider http://127.0.0.1:8333/healthz
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
      start_interval: 2s
    restart: unless-stopped
    stop_grace_period: 1m
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    logging: *production-logging

  # Signed downloads from the edge proxy. Writers use a different network and gateway.
  storage-gateway: &storage-gateway
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    entrypoint: [caddy]
    command: [run, --config, /etc/caddy/Caddyfile, --adapter, caddyfile]
    environment:
      XDG_CONFIG_HOME: /tmp/config
      XDG_DATA_HOME: /tmp/data
    user: "101:101"
    read_only: true
    tmpfs: ["/tmp:size=32m,noexec,nosuid,nodev"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./docker/storage-gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - &storage-gateway-common
        type: bind
        source: ./docker/storage-gateway/common.caddy
        target: /etc/caddy/common.caddy
        read_only: true
        bind:
          create_host_path: false
      - &storage-gateway-tls
        type: bind
        source: ./.secrets/storage-gateway
        target: /etc/caddy/tls
        read_only: true
        bind:
          create_host_path: false
      - &storage-gateway-socket storage-s3-socket:/run/seaweedfs:ro
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/health/live]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      object-storage:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    logging: *production-logging
    networks: [edge]

  storage-internal:
    <<: *storage-gateway
    volumes:
      - ./docker/storage-gateway/internal.Caddyfile:/etc/caddy/Caddyfile:ro
      - *storage-gateway-common
      - *storage-gateway-tls
      - *storage-gateway-socket
    networks:
      storage-clients:
        aliases:
          - ${HISTAE_STORAGE_HOST:?Define HISTAE_STORAGE_HOST}

  # Vérifie le bucket avec les droits d'exécution. La création est une opération manuelle.
  storage-init:
    image: ${HISTAE_API_IMAGE:-histae-api-rust:local}
    entrypoint: [/app/bin/storage-init]
    environment:
      ENV: production
      OBJECT_STORAGE_ENDPOINT: https://${HISTAE_STORAGE_HOST:?Define HISTAE_STORAGE_HOST}
      OBJECT_STORAGE_FORCE_PATH_STYLE: "true"
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-histae-photos}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-}
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    logging: *production-logging
    networks: [storage-clients]
    depends_on:
      storage-internal:
        condition: service_healthy

  migrate:
    env_file: !reset []
    entrypoint: [/app/bin/db-migrate]
    environment: !override
      <<: *production-database-environment
      POSTGRES_USER: histae_migrate
      POSTGRES_PASSWORD: ${POSTGRES_MIGRATE_PASSWORD:?Define POSTGRES_MIGRATE_PASSWORD in .env}
      POSTGRES_POOL_MAX: ${POSTGRES_POOL_MAX:-}
      PHONE_HASH_KEY: ${PHONE_HASH_KEY:?Define PHONE_HASH_KEY in .env}
    secrets:
      - postgres_ca
    depends_on:
      postgres:
        condition: service_healthy

  api:
    # Cloudflare/Caddy reaches the API on edge; never publish a host port here.
    ports: !reset []
    env_file: !reset []
    entrypoint: [/app/bin/api]
    depends_on:
      <<: *production-dependencies
      photo-codec: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment: !override
      <<: [*production-database-environment, *production-storage-environment, *production-redis-environment, *production-phone-environment, *production-stores-environment, *production-legal-environment]
      POSTGRES_USER: histae_app
      POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD:?Define POSTGRES_APP_PASSWORD in .env}
      PORT: "8080"
      RATE_LIMIT_STORE: redis
      MAINTENANCE_MODE: disabled
      METRICS_HOST: 0.0.0.0
      PHOTO_CODEC_SOCKET: /run/histae-photo-codec/codec.sock
      DATA_EXPORT_SPOOL_DIR: /var/lib/histae-exports
      POSTGRES_POOL_MAX: ${HISTAE_API_POSTGRES_POOL_MAX:-30}
      # Only the fixed ingress proxies can provide the client address.
      TRUST_PROXY: "172.30.0.3/32,172.30.0.4/32"
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ACTIVE_KID: ${JWT_ACTIVE_KID:-}
      JWT_PREVIOUS_KEYS: ${JWT_PREVIOUS_KEYS:-}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-}
      ACCOUNT_DELETION_TOKEN_TTL: ${ACCOUNT_DELETION_TOKEN_TTL:-}
      GOOGLE_PLAY_REVIEW_ENABLED: ${GOOGLE_PLAY_REVIEW_ENABLED:-}
      GOOGLE_PLAY_REVIEW_PHONE_NUMBER: ${GOOGLE_PLAY_REVIEW_PHONE_NUMBER:-}
      GOOGLE_PLAY_REVIEW_OTP: ${GOOGLE_PLAY_REVIEW_OTP:-}
      GOOGLE_PLAY_REVIEW_EXPIRES_AT: ${GOOGLE_PLAY_REVIEW_EXPIRES_AT:-}
      ADMIN_WEBAUTHN_ORIGIN: ${ADMIN_WEBAUTHN_ORIGIN:-}
      ADMIN_WEBAUTHN_RP_ID: ${ADMIN_WEBAUTHN_RP_ID:-}
      ADMIN_WEBAUTHN_RP_NAME: ${ADMIN_WEBAUTHN_RP_NAME:-}
      ADMIN_WEBAUTHN_CHALLENGE_TTL: ${ADMIN_WEBAUTHN_CHALLENGE_TTL:-}
      ADMIN_WEBAUTHN_BOOTSTRAP_TTL: ${ADMIN_WEBAUTHN_BOOTSTRAP_TTL:-}
      ADMIN_SESSION_IDLE_TTL: ${ADMIN_SESSION_IDLE_TTL:-}
      ADMIN_SESSION_ABSOLUTE_TTL: ${ADMIN_SESSION_ABSOLUTE_TTL:-}
      ADMIN_RECENT_AUTH_TTL: ${ADMIN_RECENT_AUTH_TTL:-}
      SWEEGO_WEBHOOK_SECRET: ${SWEEGO_WEBHOOK_SECRET:-}
      WEB_ACCOUNT_ORIGIN: ${WEB_ACCOUNT_ORIGIN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      ADVERTISING_PROVIDER: ${ADVERTISING_PROVIDER:-}
      ADMOB_ANDROID_REWARDED_AD_UNIT: ${ADMOB_ANDROID_REWARDED_AD_UNIT:-}
      ADMOB_IOS_REWARDED_AD_UNIT: ${ADMOB_IOS_REWARDED_AD_UNIT:-}
      ADMOB_REWARD_ITEM: ${ADMOB_REWARD_ITEM:-}
      METRICS_ENABLED: ${METRICS_ENABLED:-}
      METRICS_PORT: ${METRICS_PORT:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      DATA_EXPORT_PAGE_SIZE: ${DATA_EXPORT_PAGE_SIZE:-}
      DATA_EXPORT_MAX_BYTES: ${DATA_EXPORT_MAX_BYTES:-}
      DATA_EXPORT_MAX_CONCURRENCY: ${DATA_EXPORT_MAX_CONCURRENCY:-}
      DATA_EXPORT_SPOOL_BYTES: ${DATA_EXPORT_SPOOL_BYTES:-}
      DATA_EXPORT_DOWNLOAD_TIMEOUT: ${DATA_EXPORT_DOWNLOAD_TIMEOUT:-}
      RATE_LIMIT_GLOBAL: ${RATE_LIMIT_GLOBAL:-}
      RATE_LIMIT_GLOBAL_WINDOW: ${RATE_LIMIT_GLOBAL_WINDOW:-}
      RATE_LIMIT_OTP: ${RATE_LIMIT_OTP:-}
      RATE_LIMIT_OTP_WINDOW: ${RATE_LIMIT_OTP_WINDOW:-}
      RATE_LIMIT_REFRESH: ${RATE_LIMIT_REFRESH:-}
      RATE_LIMIT_REFRESH_WINDOW: ${RATE_LIMIT_REFRESH_WINDOW:-}
      RATE_LIMIT_FEED: ${RATE_LIMIT_FEED:-}
      RATE_LIMIT_FEED_WINDOW: ${RATE_LIMIT_FEED_WINDOW:-}
      RATE_LIMIT_MESSAGE: ${RATE_LIMIT_MESSAGE:-}
      RATE_LIMIT_MESSAGE_WINDOW: ${RATE_LIMIT_MESSAGE_WINDOW:-}
      RATE_LIMIT_DATA_EXPORT: ${RATE_LIMIT_DATA_EXPORT:-}
      RATE_LIMIT_DATA_EXPORT_WINDOW: ${RATE_LIMIT_DATA_EXPORT_WINDOW:-}
      RATE_LIMIT_REPORT: ${RATE_LIMIT_REPORT:-}
      RATE_LIMIT_REPORT_WINDOW: ${RATE_LIMIT_REPORT_WINDOW:-}
      RATE_LIMIT_PHOTO: ${RATE_LIMIT_PHOTO:-}
      RATE_LIMIT_PHOTO_WINDOW: ${RATE_LIMIT_PHOTO_WINDOW:-}
      RATE_LIMIT_SWIPE: ${RATE_LIMIT_SWIPE:-}
      RATE_LIMIT_SWIPE_WINDOW: ${RATE_LIMIT_SWIPE_WINDOW:-}
      RATE_LIMIT_BILLING: ${RATE_LIMIT_BILLING:-}
      RATE_LIMIT_BILLING_WINDOW: ${RATE_LIMIT_BILLING_WINDOW:-}
      RATE_LIMIT_BILLING_WEBHOOK: ${RATE_LIMIT_BILLING_WEBHOOK:-}
      RATE_LIMIT_BILLING_WEBHOOK_WINDOW: ${RATE_LIMIT_BILLING_WEBHOOK_WINDOW:-}
      RATE_LIMIT_SMS_WEBHOOK: ${RATE_LIMIT_SMS_WEBHOOK:-}
      RATE_LIMIT_SMS_WEBHOOK_WINDOW: ${RATE_LIMIT_SMS_WEBHOOK_WINDOW:-}
      RATE_LIMIT_ADMIN_AUTH: ${RATE_LIMIT_ADMIN_AUTH:-}
      RATE_LIMIT_ADMIN_AUTH_WINDOW: ${RATE_LIMIT_ADMIN_AUTH_WINDOW:-}
      TERMS_OF_SERVICE_URL_EN: ${TERMS_OF_SERVICE_URL_EN:-}
      TERMS_OF_SERVICE_URL_ES: ${TERMS_OF_SERVICE_URL_ES:-}
      TERMS_OF_SERVICE_URL_IT: ${TERMS_OF_SERVICE_URL_IT:-}
      PRIVACY_POLICY_URL_EN: ${PRIVACY_POLICY_URL_EN:-}
      PRIVACY_POLICY_URL_ES: ${PRIVACY_POLICY_URL_ES:-}
      PRIVACY_POLICY_URL_IT: ${PRIVACY_POLICY_URL_IT:-}
      SENSITIVE_DATA_CONSENT_URL_EN: ${SENSITIVE_DATA_CONSENT_URL_EN:-}
      SENSITIVE_DATA_CONSENT_URL_ES: ${SENSITIVE_DATA_CONSENT_URL_ES:-}
      SENSITIVE_DATA_CONSENT_URL_IT: ${SENSITIVE_DATA_CONSENT_URL_IT:-}
      LOCATION_CONSENT_URL_EN: ${LOCATION_CONSENT_URL_EN:-}
      LOCATION_CONSENT_URL_ES: ${LOCATION_CONSENT_URL_ES:-}
      LOCATION_CONSENT_URL_IT: ${LOCATION_CONSENT_URL_IT:-}
    secrets:
      - postgres_ca
      - store_verifier_ca
    restart: always
    networks:
      backend:
      redis-private:
      storage-clients:
      edge:
        aliases:
          - histae-api-production

  outbox-worker:
    env_file: !reset []
    entrypoint: [/app/bin/outbox]
    depends_on:
      <<: *production-dependencies
      redis: { condition: service_healthy }
    environment: !override
      <<: [*production-database-environment, *production-storage-environment, *production-redis-environment, *production-phone-environment, *production-stores-environment, *production-legal-environment]
      POSTGRES_USER: histae_outbox
      POSTGRES_PASSWORD: ${POSTGRES_OUTBOX_PASSWORD:?Define POSTGRES_OUTBOX_PASSWORD in .env}
      MAINTENANCE_MODE: worker
      POSTGRES_POOL_MAX: ${POSTGRES_POOL_MAX:-}
      SWEEGO_API_KEY: ${SWEEGO_API_KEY:-}
      SWEEGO_SMS_SENDER_ID: ${SWEEGO_SMS_SENDER_ID:-}
      SWEEGO_API_URL: ${SWEEGO_API_URL:-}
      PUSH_PROVIDER: ${PUSH_PROVIDER:-}
      PUSH_TIMEOUT: ${PUSH_TIMEOUT:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
      FIREBASE_TOKEN_URI: ${FIREBASE_TOKEN_URI:-}
      OUTBOX_PURGE_BATCH_SIZE: ${OUTBOX_PURGE_BATCH_SIZE:-}
      OUTBOX_PURGE_MAX_BATCHES: ${OUTBOX_PURGE_MAX_BATCHES:-}
    secrets:
      - postgres_ca
      - store_verifier_ca
    restart: always
    networks: [backend, redis-private, storage-clients]

  phone-blocklist-sync:
    environment:
      ENV: production
      POSTGRES_SSLMODE: verify-full
      NODE_EXTRA_CA_CERTS: /run/secrets/postgres_ca
    secrets:
      - postgres_ca

  maintenance:
    env_file: !reset []
    entrypoint: [/app/bin/maintenance]
    depends_on: *production-dependencies
    environment: !override
      <<: [*production-database-environment, *production-storage-environment, *production-store-flags]
      POSTGRES_USER: histae_maintenance
      POSTGRES_PASSWORD: ${POSTGRES_MAINTENANCE_PASSWORD:?Define POSTGRES_MAINTENANCE_PASSWORD in .env}
      MAINTENANCE_MODE: worker
      POSTGRES_POOL_MAX: ${POSTGRES_POOL_MAX:-}
      MATCH_MAINTENANCE_BATCH_SIZE: ${MATCH_MAINTENANCE_BATCH_SIZE:-}
      MATCH_MAINTENANCE_MAX_BATCHES: ${MATCH_MAINTENANCE_MAX_BATCHES:-}
    secrets:
      - postgres_ca
    networks: [backend, storage-clients]

volumes:
  histae-postgres-production-data:
  histae-object-storage-production-data:
  storage-s3-socket:

secrets:
  # Certificat public de l'autorité, jamais sa clé privée.
  postgres_ca:
    file: ./.secrets/postgres/ca.crt
  s3_identity:
    file: ./.secrets/seaweedfs/s3.json
  store_verifier_ca:
    file: ./.secrets/store-verifier/ca.crt
  store_verifier_cert:
    file: ./.secrets/store-verifier/server.crt
  store_verifier_key:
    file: ./.secrets/store-verifier/server.key

networks:
  storage-clients:
    internal: true
  redis-private:
    internal: true
  # Réseaux créés par l'exploitation avant le déploiement ; aucun port hôte public.
  backend:
    name: ${HISTAE_BACKEND_NETWORK:-histae-backend}
    external: true
  edge:
    name: ${HISTAE_EDGE_NETWORK:-histae-edge}
    external: true
