global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: histae-api
    environment: development

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: histae-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/histae_metrics_token
    static_configs:
      - targets: [host.docker.internal:9091]
