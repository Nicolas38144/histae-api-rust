global:
  resolve_timeout: 5m

route:
  receiver: local-dashboard
  group_by: [alertname, severity, component]
  group_wait: 15s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: local-dashboard

inhibit_rules:
  - source_matchers: [alertname="HistaeMetricsUnavailable"]
    target_matchers: [service="histae-api"]
    equal: [service]
