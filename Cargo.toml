[package]
name = "histae-api-rust"
version = "0.1.0"
edition = "2024"

[features]
default = []
webauthn-probe = [
    "dep:base64",
    "dep:openssl",
    "dep:serde_cbor_2",
    "dep:url",
    "dep:webauthn-rs-core",
]

[dependencies]
base64 = { version = "0.22.1", optional = true }
imagesize = "0.14.0"
openssl = { version = "0.10.75", features = ["vendored"], optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["cookies", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_cbor_2 = { version = "0.13.0", optional = true }
serde_json = "1.0.145"
sha2 = "0.10.9"
tokio = { version = "1.47.1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
url = { version = "2.5.7", optional = true }
webauthn-rs-core = { version = "=0.5.5", optional = true }

[[bin]]
name = "contract-compare"
path = "src/bin/contract_compare.rs"
