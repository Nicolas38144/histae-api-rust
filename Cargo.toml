[package]
name = "histae-api-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
autobins = false

[features]
default = []
postgres-integration = []
redis-integration = []
webauthn-probe = [
    "dep:openssl",
    "dep:serde_cbor_2",
    "dep:webauthn-rs-core",
]

[dependencies]
axum = "0.8.6"
aes-gcm = "0.10.3"
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde"] }
imagesize = "0.14.0"
dotenvy = "0.15.7"
futures-util = "0.3.31"
getrandom = "0.3.4"
hmac = "0.12.1"
ipnet = "2.11.0"
jsonwebtoken = { version = "10.2.0", default-features = false, features = ["rust_crypto"] }
log = "0.4.28"
openssl = { version = "0.10.75", features = ["vendored"], optional = true }
regex = "1.11.2"
reqwest = { version = "0.13.5", default-features = false, features = ["cookies", "json", "rustls", "stream"] }
redis = { version = "0.32.7", default-features = false, features = ["connection-manager", "tokio-rustls-comp"] }
rust_decimal = { version = "1.39.0", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_cbor_2 = { version = "0.13.0", optional = true }
serde_json = "1.0.145"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["chrono", "json", "postgres", "runtime-tokio-rustls", "rust_decimal", "uuid"] }
subtle = "2.6.1"
tokio = { version = "1.47.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.16", features = ["rt"] }
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.6", features = ["cors"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["env-filter", "fmt"] }
url = "2.5.7"
uuid = { version = "1.18.1", features = ["serde", "v4"] }
unicode-normalization = "0.1.24"
webauthn-rs-core = { version = "=0.5.5", optional = true }

[[bin]]
name = "contract-compare"
path = "src/bin/contract_compare.rs"

[[bin]]
name = "api"
path = "src/bin/api.rs"

[[bin]]
name = "outbox"
path = "src/bin/outbox.rs"

[[bin]]
name = "maintenance"
path = "src/bin/maintenance.rs"

[[bin]]
name = "admin-bootstrap"
path = "src/bin/admin_bootstrap.rs"
