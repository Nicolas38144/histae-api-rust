# État éphémère : préserver les compteurs jusqu'à leur expiration tant que Redis tourne.
save ""
appendonly no
maxmemory 128mb
maxmemory-policy noeviction
# Authentification par mot de passe, certificat serveur signé par la CA interne commune.
port 0
tls-port 6379
tls-cert-file /etc/redis/tls/server.crt
tls-key-file /etc/redis/tls/server.key
tls-ca-cert-file /run/secrets/postgres_ca
tls-auth-clients no
