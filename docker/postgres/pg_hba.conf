# Socket Unix privé au conteneur : initialisation de l'image et administration locale.
# Aucun socket n'est partagé avec les conteneurs applicatifs.
local all all trust

# Refus explicite du TCP non chiffré, y compris sur le réseau Docker.
hostnossl all all all reject
# TLS obligatoire et mot de passe SCRAM ; pas de trust sur le réseau.
hostssl all all all scram-sha-256
