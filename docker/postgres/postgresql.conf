# PostgreSQL de production sur le réseau Docker privé ; aucun port hôte publié.
listen_addresses = '*'
port = 5432
hba_file = '/etc/postgresql/histae/pg_hba.conf'
password_encryption = 'scram-sha-256'

# Certificat signé par la CA fournie aux clients Node, avec SAN DNS:postgres.
ssl = on
ssl_min_protocol_version = 'TLSv1.2'
ssl_cert_file = '/etc/postgresql/tls/server.crt'
ssl_key_file = '/etc/postgresql/tls/server.key'

# Budget conteneur : 7 Gio. Cache partagé = 25 % ; garder de la marge pour
# connexions, opérations simultanées, autovacuum et cache de fichiers.
shared_buffers = '1792MB'
# Estimation pour le planificateur : ne réserve et n'alloue aucune mémoire.
effective_cache_size = '4GB'
# Par opération de tri/hash, potentiellement plusieurs fois par requête/worker.
work_mem = '4MB'
maintenance_work_mem = '128MB'
autovacuum_work_mem = '64MB'
# Chaque processus API/worker ajoute POSTGRES_POOL_MAX + 4 connexions.
# Recalculer le budget avant de multiplier les instances.
max_connections = 100

# Ne pas consigner le SQL métier ou ses paramètres lors d'un échec.
log_statement = 'none'
log_min_error_statement = 'panic'
log_parameter_max_length_on_error = 0
